<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <!-- Thin arching hand-drawn string line across the top -->
  <path d="M 10 32 Q 130 18, 200 24 T 390 32" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  
  <!-- Center Tied Ribbon Bow -->
  <g transform="translate(178, 12)">
    <!-- Bow Loops -->
    <!-- Left Loop -->
    <path d="M 22 14 C 10 2, -6 10, -2 20 C 1 27, 14 22, 21 16 Z" fill="#1c1c1c" stroke="#121212" stroke-width="1"/>
    <!-- Left loop inner hollow -->
    <path d="M 18 14 C 8 5, -1 11, 2 18 C 5 23, 14 18, 18 14 Z" fill="#faf6ee"/>
    
    <!-- Right Loop -->
    <path d="M 24 14 C 36 2, 52 10, 48 20 C 45 27, 32 22, 25 16 Z" fill="#1c1c1c" stroke="#121212" stroke-width="1"/>
    <!-- Right loop inner hollow -->
    <path d="M 28 14 C 38 5, 47 11, 44 18 C 41 23, 32 18, 28 14 Z" fill="#faf6ee"/>

    <!-- Center Knot -->
    <ellipse cx="23" cy="15" rx="5.5" ry="4.5" fill="#181818"/>
    <path d="M 20 13 Q 23 16 26 13" stroke="#333" stroke-width="1.2" fill="none"/>

    <!-- Flowing Ribbon Tails -->
    <!-- Left Tail -->
    <path d="M 20 18 Q 12 36 10 54 Q 14 44 21 38 Q 23 28 22 18 Z" fill="#1c1c1c"/>
    <!-- Right Tail -->
    <path d="M 26 18 Q 34 36 36 54 Q 32 44 25 38 Q 23 28 24 18 Z" fill="#1c1c1c"/>
  </g>
</svg>
