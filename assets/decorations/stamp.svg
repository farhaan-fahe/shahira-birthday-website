<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Vintage postage stamp style SVG -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Perforated edge stamp background -->
  <rect x="5" y="5" width="90" height="110" rx="3" fill="#fcf8f2" stroke="#c24d58" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="12" y="12" width="76" height="96" fill="#fff5f7" stroke="#e8829c" stroke-width="1"/>
  <!-- Inner illustration -->
  <circle cx="50" cy="50" r="22" fill="#fae8ee"/>
  <path d="M50,38 C47,32 38,32 36,40 C34,48 50,60 50,60 C50,60 66,48 64,40 C62,32 53,32 50,38 Z" fill="#c24d58"/>
  <text x="50" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="bold" fill="#6c5b7b" text-anchor="middle" letter-spacing="1">SPECIAL DELIVERY</text>
  <text x="50" y="94" font-family="'Caveat', cursive" font-size="11" fill="#c24d58" text-anchor="middle">09 · 10</text>
  <!-- Postmark circular stamp -->
  <circle cx="70" cy="30" r="16" stroke="#9d7bb0" stroke-width="1" stroke-dasharray="3 1.5" fill="none" opacity="0.6"/>
  <path d="M55,30 L85,30 M57,26 L83,26 M57,34 L83,34" stroke="#9d7bb0" stroke-width="0.8" opacity="0.6"/>
</svg>
