<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 5-Point Hand-Drawn Charcoal Star -->
  <defs>
    <!-- Stippled / glitter star texture pattern -->
    <pattern id="glitterPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#a0a0a0"/>
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.8"/>
      <circle cx="3" cy="3" r="0.8" fill="#444444" opacity="0.6"/>
      <circle cx="3" cy="1" r="0.6" fill="#111111" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Charcoal Star -->
  <g id="charcoalStar">
    <path d="M 50 8 L 61 36 L 91 37 L 66 54 L 76 83 L 50 65 L 24 83 L 34 54 L 9 37 L 39 36 Z" 
          fill="#1c1c1c" stroke="#111111" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
