<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="glitterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#8e8e8e"/>
      <stop offset="100%" stop-color="#555555"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.7  0 0 0 0 0.7  0 0 0 0 0.7  0 0 0 1 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>
  <!-- Glitter Textured Star -->
  <path d="M 50 10 L 61 36 L 90 38 L 66 54 L 75 82 L 50 66 L 25 82 L 34 54 L 10 38 L 39 36 Z" 
        fill="url(#glitterGrad)" stroke="#444444" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
