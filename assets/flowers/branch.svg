    <circle cx="92" cy="12" r="3.5" fill="#e8829c" stroke="#c24d58" stroke-width="1.2"/>
    <circle cx="115" cy="115" r="3" fill="#e8829c" stroke="#c24d58" stroke-width="1.2"/>
    <circle cx="33" cy="80" r="3" fill="#e8829c" stroke="#c24d58" stroke-width="1.2"/>
