  <g stroke-linecap="round" stroke-linejoin="round" stroke="#7a9a7a" stroke-width="2">
    <!-- Main stem -->
    <path d="M80,290 Q85,200 70,120 Q60,60 90,10"/>
    
    <!-- Leaves Left -->
    <path d="M78,240 Q50,225 45,205 Q70,215 77,235 Z" fill="#e8f3e8"/>
