<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor">
  <!-- Elegant hand-drawn Lily SVG -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" stroke="#c24d58">
    <!-- Center stamen -->
    <path d="M100,105 Q98,75 94,55" stroke="#9d7bb0" stroke-width="1.8"/>
    <circle cx="94" cy="53" r="3" fill="#e8829c" stroke="#9d7bb0"/>
    <path d="M102,106 Q105,72 109,52" stroke="#9d7bb0" stroke-width="1.8"/>
    <circle cx="109" cy="50" r="3" fill="#e8829c" stroke="#9d7bb0"/>
    <path d="M99,108 Q86,85 78,70" stroke="#9d7bb0" stroke-width="1.8"/>
    <circle cx="77" cy="68" r="2.8" fill="#e8829c" stroke="#9d7bb0"/>
    <path d="M103,108 Q118,87 125,72" stroke="#9d7bb0" stroke-width="1.8"/>
    <circle cx="126" cy="70" r="2.8" fill="#e8829c" stroke="#9d7bb0"/>
    <!-- Petals -->
    <!-- Top Center Petal -->
    <path d="M100,105 C95,80 82,45 98,22 C108,42 108,78 100,105 Z" fill="#fff5f7" fill-opacity="0.85"/>
    <path d="M99,40 Q98,70 100,95" stroke="#e8829c" stroke-width="1.2" stroke-dasharray="2 3"/>
    <!-- Top Left Petal -->
    <path d="M96,105 C75,90 42,65 35,38 C55,42 82,75 96,105 Z" fill="#fff0f3" fill-opacity="0.85"/>
    <path d="M55,52 Q75,76 92,100" stroke="#e8829c" stroke-width="1.2" stroke-dasharray="2 3"/>
    <!-- Top Right Petal -->
    <path d="M104,105 C125,90 158,65 165,38 C145,42 118,75 104,105 Z" fill="#fff0f3" fill-opacity="0.85"/>
    <path d="M145,52 Q125,76 108,100" stroke="#e8829c" stroke-width="1.2" stroke-dasharray="2 3"/>
    <!-- Bottom Left Petal -->
    <path d="M95,108 C68,118 35,135 30,162 C48,150 78,130 95,108 Z" fill="#fdfbf7" fill-opacity="0.9"/>
    <!-- Bottom Right Petal -->
    <path d="M105,108 C132,118 165,135 170,162 C152,150 122,130 105,108 Z" fill="#fdfbf7" fill-opacity="0.9"/>
    <!-- Bottom Center Petal -->
    <path d="M98,110 C92,135 88,172 102,185 C112,170 108,135 102,110 Z" fill="#fff5f7" fill-opacity="0.9"/>
    <!-- Stems and delicate bud -->
    <path d="M100,115 Q98,155 92,192" stroke="#7a9a7a" stroke-width="2.5"/>
    <path d="M96,150 Q75,145 65,135 Q78,132 94,142" fill="#d9ebd9" stroke="#7a9a7a" stroke-width="1.5"/>
  </g>
  <!-- Delicate speckles -->
  <circle cx="95" cy="85" r="1" fill="#b23a48"/>
  <circle cx="98" cy="78" r="1.2" fill="#b23a48"/>
  <circle cx="102" cy="82" r="1" fill="#b23a48"/>
  <circle cx="104" cy="75" r="1.1" fill="#b23a48"/>
  <circle cx="90" cy="90" r="1" fill="#b23a48"/>
  <circle cx="110" cy="90" r="1" fill="#b23a48"/>
</svg>
